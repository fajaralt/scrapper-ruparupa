name: Daily RupaRupa Product Scraper

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB
    - cron: "0 23 * * *" # 06:00 WIB
    - cron: "0 5 * * *"  # 12:00 WIB
    - cron: "0 11 * * *" # 18:00 WIB
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Category batch index (0-19)"
        required: false
        default: "0"
        type: string
      category_urls:
        description: "Optional comma-separated category URLs"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          RUPARUPA_CATEGORY_BATCH_SIZE: "10"
          RUPARUPA_CATEGORY_BATCH_INDEX: ${{ inputs.batch_index || '0' }}
          RUPARUPA_CATEGORY_URLS: ${{ inputs.category_urls || '' }}
        run: python -u scraper.py

      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruparupa_products.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update RupaRupa product prices"
          git push
